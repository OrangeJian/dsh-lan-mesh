function inboxDetail(){const r=inboxRows.find(r=>r.id===selectedInbox)||inboxRows[0];return `<aside class="inbox-detail" id="inbox-detail"><div class="row between"><span class="small muted">提醒详情</span>${btn('关闭','close-detail','quiet mobile-detail')}</div><div style="margin-top:20px">${pill(r.type==='task'?'任务事件':r.type==='doc'?'文档提及':'未读提醒',r.type==='task'?'warn':'accent')}<h2 style="margin-top:12px">${r.title}</h2><div class="row small muted" style="margin-top:12px">${avatar(r.author.slice(0,1))}<span>${r.author}<br>Jian · Windows</span></div><p class="small muted" style="margin-top:12px">2026-11-15 ${r.time}:00<br># ${r.room}</p></div><div class="detail-content"><p>${r.text}</p><div class="hint">选择提醒仅查看详情；点“标为已读”后才移出列表。只有保存成功才更新未读数。</div>${r.type==='task'?'<div class="reference">'+icon('task')+'<div><b>T-12 · 网络总览实现</b><p class="small">Execution e-08 · 第 1 次尝试</p></div></div><p class="small muted" style="margin-top:12px">任务成果、Execution 详情待对应能力接入；本稿不提供审批或合并操作。</p>':''}</div><div class="detail-footer stack">${btn('前往来源房间','goto-room','primary','chevron')}${btn('标为已读','read-one','','check')}</div></aside>`}
function inbox(){return header(`收件箱 <span class="small muted">${unread} 条未读</span>`,'协作 / 需要处理的消息',btn('全部标为已读','read-all','','check'))+notice()+(needsState()?stateBody('inbox'):`<div class="inbox-layout"><div class="inbox-center"><div class="inbox-controls"><div class="filter-chips" aria-label="提醒分类">${['全部','@我','任务','系统'].map(f=>`<button data-filter="${f}" class="${filter===f?'selected':''}">${f}</button>`).join('')}</div><label class="search">${icon('search')}<input id="inbox-search" placeholder="搜索项目或正文" value="${esc(search)}" aria-label="搜索项目或正文"></label></div><div class="row between small muted" style="padding:8px 24px;background:var(--panel)"><span>仅未读 · 不含自己发送的消息</span><span>按时间倒序</span></div><div class="inbox-list"><div class="list-label">今天 · ${filteredRows().length} 条</div>${filteredRows().map(r=>`<button class="inbox-row ${r.id===selectedInbox?'selected':''}" data-inbox="${r.id}"><span class="unread-dot"></span>${avatar(r.author.slice(0,1),r.author==='系统'?'':'ai')}<span><span class="subject">${r.title}</span><span class="preview">${r.text}</span><span class="origin">${r.author} · ${r.room}</span></span><time>${r.time}</time></button>`).join('')||'<div class="empty-state"><p class="muted">没有符合条件的提醒</p></div>'}</div></div>${inboxDetail()}</div>`)}
function needsState(){return ['empty','loading','failed','denied'].includes(state)}
function render(){document.documentElement.dataset.theme=theme;document.getElementById('theme').textContent=theme==='light'?'深色':'浅色';document.getElementById('state').value=state;document.getElementById('root').innerHTML=`<div class="app">${rail()}<main class="workspace">${page==='room'?room():page==='inbox'?inbox():network()}</main></div>`;bind()}
function toast(text){document.getElementById('overlays').innerHTML=`<div class="toast" role="status">${text}</div>`;setTimeout(()=>{const t=document.querySelector('.toast');if(t)t.remove()},3800)}
function modal(title,body,confirm='',callback){document.getElementById('overlays').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}" tabindex="-1"><h2>${title}</h2><p>${body}</p><div class="actions">${btn('关闭','modal-close')}${confirm?btn(confirm,'modal-confirm','primary'):''}</div></section></div>`;document.querySelector('.modal').focus();const previous=document.activeElement;document.querySelector('[data-action=modal-close]').onclick=()=>document.getElementById('overlays').replaceChildren();const c=document.querySelector('[data-action=modal-confirm]');if(c)c.onclick=()=>{document.getElementById('overlays').replaceChildren();callback?.()};document.querySelector('.modal-backdrop').onkeydown=e=>{if(e.key==='Escape')document.getElementById('overlays').replaceChildren();if(e.key==='Tab'){const b=[...document.querySelectorAll('.modal button')];if(e.shiftKey&&document.activeElement===b[0]){e.preventDefault();b.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===b.at(-1)){e.preventDefault();b[0].focus()}}}}
function action(a,target){const descriptions={diagnostics:['只读诊断','生产版复用已有诊断脚本与报告。连接、签名/信任、宿主、附件、任务分项显示；未检查为未知，复制前脱敏。当前尚无面板诊断接口，本设计不假装已经接入。'],about:['本机身份与版本','简 · Jian / Windows · node-5b43…；界面基线 v0.4.4，服务版本需独立读取。此预览版本 UX-0.1，不是新插件版本。'],discover:['发现项目','6 个可加入项目在此集中展示，带房间身份与 Leader 设备信息；同名项目以 Room ID 消歧。原侧栏不再长驻加入卡片。'],archive:['已归档项目','保留参与记录。归档房间只读、默认隐藏；Leader 可依现有能力恢复。不提供尚未实现的接管或本机删除。'],manage:['管理与诊断','本机身份 / 已配置可信节点（只读） / 静态节点配置说明 / 只读诊断 / 关于。配对、撤销、接管未交付，不提供假按钮。'],projects:['查找或创建项目','UX-1 保留现有创建入口，支持按项目名称和身份筛选。项目设置移入行尾菜单。'],documents:['共享文档','保留已有目录、修订阅读、提案、冲突、导入导出与投递记录。不改变现有文档权威。'],tasks:['任务工作区','先接入已有 Room 任务与 M1 执行账本，分别标记来源。计划审批 / DAG / 自动调度在 M6 正式交付前不显示可执行按钮。'], 'task-ledger':['现有任务记录','Room 任务与 Team Task 分组呈现，Worker 完成不等于人类验收。任务详情展示 Execution、上下文与成果；未交付的审批与 DAG 隐藏。'],invite:['邀请成员','任何已授权的人类成员均可拉入自己机器上的会话；候选显示设备名和精确会话身份。'],mention:['选择成员或文档','Lead · Jian / Windows；Reviewer · 林 / MacBook；Reviewer · Jian / Windows。文档候选单独分组，固定 revision/hash，不触发 Agent 唤醒。'],skill:['技能引用','引用本机可用技能作为能力提示。显示来源机器，不自动安装、运行，也不声称同名技能版本一致。'],attachment:['附件与图片','保留选择文件、拖拽和粘贴图片。上传中显示进度，失败保留草稿和稳定消息 ID，并可针对失败项重试。'],assign:['设为任务','复用现有 Room 任务指派。明确选择具体设备上的成员；与 M6 计划批准是两种不同操作。'], 'room-menu':['房间操作','重命名 / 置顶 / 静音 / 归档（Leader）/ 退出。归档与静音范围沿用现有服务；退出仅在既有授权范围执行。'], 'project-menu':['项目操作','查看项目 / 置顶 / 静音 / 设置 / 归档（Leader）。每个项目只保留一个操作入口。']};if(a==='return-native'){modal('返回 DSH 原生对话','生产版使用已有 leavePanel：释放主面板，恢复原生侧栏，回到上次打开的会话。此预览不连接 DSH。');return}if(a==='retry'||a==='refresh'){state='loading';render();setTimeout(()=>{state='default';render();toast('示例：重新读取成功。未访问真实节点。')},650);return}if(a==='fit'){toast('示例：以本机和所有可见节点适应画布。');return}if(a==='remove-chip'){const chip=target.closest('.pill');removedChips.add(chip.textContent.replace('×','').trim());chip.remove();return}if(a==='send'){toast('设计预览不发送消息，草稿保持原样。');return}if(a==='expand-message'){target.outerHTML='<pre style="white-space:pre-wrap;padding:12px;background:var(--panel);border-radius:7px;font-size:12px">// 示例测试证据\nassert(task.status === "review")\nassert(execution.state === "succeeded")\n// 未验收前不推进依赖，也不自动合并</pre>';return}if(a==='read-all'){modal('将 26 条提醒标为已读？','只影响当前节点的未读提醒，原房间消息和文档记录保留。生产版写入失败时保留列表并提示重试。','确认（演示）',()=>{unread=0;state='empty';render()});return}if(a==='read-one'){inboxRows.splice(inboxRows.findIndex(r=>r.id===selectedInbox),1);unread=inboxRows.length;selectedInbox=inboxRows[0]?.id??0;if(!unread)state='empty';render();toast('示例：已读保存成功后移除提醒。');return}if(a==='goto-room'){page='room';state='default';render();return}if(['members','node-detail'].includes(a)){if(target?.dataset.node){selectedDevice=target.dataset.node;render()}const el=document.getElementById(a==='members'?'room-inspector':'node-inspector');if(el){el.classList.add('drawer');el.setAttribute('tabindex','-1');el.focus()}return}if(a==='close-detail'){target.closest('aside').classList.remove('drawer');return}if(a==='empty-action'){state='default';render();return}if(a==='projects'){modal('我的项目',rooms.map(r=>'<span style="display:block;padding:8px 0">'+esc(r)+'</span>').join('')+'<span class="small">当前设计稿展示首个项目的 Room。</span>','打开示例项目',()=>{page='room';state='default';render()});return}if(descriptions[a])modal(...descriptions[a]);}

document.querySelectorAll('.pill.good').forEach(e=>{e.classList.replace('good','warn');e.textContent='状态待核对'});
document.querySelectorAll('.spin').forEach(e=>{const p=e.closest('.pill');if(p){p.classList.remove('accent');p.classList.add('warn');p.textContent='上次执行中 · 待核对'}else e.remove()});
document.querySelectorAll('.inspector .kv dd .pill').forEach(e=>{e.className='pill warn';e.textContent='状态待核对'});document.querySelectorAll('.node-list .small').forEach(e=>e.textContent='13:26 历史快照 · 当前待核对');document.querySelectorAll('.stats .stat .small').forEach(e=>e.textContent='上次快照 · 当前待核对');document.querySelectorAll('.node .pill').forEach(e=>{e.textContent='历史快照';e.classList.remove('accent')});
document.querySelectorAll('.node p').forEach(e=>{if(e.textContent.includes('最近可见'))e.textContent='上次观测 13:26:08'});

document.querySelectorAll('.agent .pill').forEach(e=>{if(e.textContent.includes('存活')){e.classList.add('warn');e.textContent='状态待核对'}});
const health=document.querySelector('.health');if(health)health.innerHTML='<span class="dot" style="color:var(--amber)"></span>'+ (state==='offline'?'本机服务连接中断':'本机状态已过期');
document.querySelectorAll('.dot').forEach(e=>{e.style.color='var(--amber)'});
}const textarea=document.querySelector('textarea');if(textarea)textarea.oninput=e=>draft=e.target.value;document.querySelectorAll('.ref-chips .pill').forEach(c=>{if(removedChips.has(c.textContent.replace('×','').trim()))c.remove()});if(state==='offline'){document.querySelectorAll('[data-action=send],[data-action=assign]').forEach(b=>{b.disabled=true;b.title='连接恢复后重试，保留草稿'})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page==='tasks'){action('tasks');return}page=b.dataset.page;state='default';render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{networkMode=b.dataset.mode;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-inbox]').forEach(b=>b.onclick=()=>{selectedInbox=+b.dataset.inbox;render();if(innerWidth<=1100){const d=document.getElementById('inbox-detail');d.classList.add('drawer');d.setAttribute('tabindex','-1');d.focus()}});const input=document.getElementById('inbox-search');if(input)input.oninput=e=>{const position=e.target.selectionStart;search=e.target.value;render();const next=document.getElementById('inbox-search');next.focus();next.setSelectionRange(position,position)}}
document.getElementById('state').onchange=e=>{state=e.target.value;render()};document.getElementById('theme').onclick=()=>{theme=theme==='light'?'dark':'light';render()};document.getElementById('collapse').onclick=()=>document.body.classList.toggle('collapsed');document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('overlays').replaceChildren();document.querySelectorAll('.drawer').forEach(d=>d.classList.remove('drawer'))}});render();
